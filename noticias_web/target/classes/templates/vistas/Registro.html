<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{vistas/Inicio :: layout(~{::section})}">

<body>
    <section class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Crear Cuenta</h1>
                <p style="color: var(--secondary);">Únete a nuestra comunidad de noticias</p>
            </div>

            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}">Error message</span>
            </div>

            <form th:action="@{/auth/registro}" method="post">
                <div class="form-group">
                    <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                    <input type="text" id="nombreCompleto" name="nombreCompleto" class="form-input"
                        placeholder="Juan Pérez" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="nombre@ejemplo.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="movil" class="form-label">Móvil <span style="color: var(--danger);">*</span></label>
                    <input type="tel" id="movil" name="movil" class="form-input" placeholder="600000000"
                        pattern="[0-9]{9}" title="Debe ser un número de 9 dígitos" required>
                    <small style="color: var(--text-muted); font-size: 0.85rem;">Formato: 9 dígitos sin espacios</small>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>

                    <!-- Password Strength Indicator -->
                    <div id="passwordRequirements"
                        style="background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 0.875rem;">
                        <div style="font-weight: 600; margin-bottom: 8px; color: #495057;">Requisitos de contraseña:
                        </div>
                        <div id="req-length" class="password-req" style="color: #dc3545; margin: 4px 0;">
                            <span class="req-icon">✗</span> Mínimo 6 caracteres
                        </div>
                        <div id="req-uppercase" class="password-req" style="color: #dc3545; margin: 4px 0;">
                            <span class="req-icon">✗</span> Una letra mayúscula
                        </div>
                        <div id="req-lowercase" class="password-req" style="color: #dc3545; margin: 4px 0;">
                            <span class="req-icon">✗</span> Una letra minúscula
                        </div>
                        <div id="req-number" class="password-req" style="color: #dc3545; margin: 4px 0;">
                            <span class="req-icon">✗</span> Un número
                        </div>
                        <div id="req-special" class="password-req" style="color: #dc3545; margin: 4px 0;">
                            <span class="req-icon">✗</span> Un carácter especial (!@#$%^&*)
                        </div>
                    </div>

                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••"
                        minlength="6" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                        placeholder="••••••••" required>
                </div>


                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">Registrarse</button>
            </form>


            <script>
                const passwordInput = document.getElementById('password');
                const confirmPasswordInput = document.getElementById('confirmPassword');
                const submitBtn = document.getElementById('submitBtn');

                const requirements = {
                    length: { regex: /.{6,}/, element: document.getElementById('req-length') },
                    uppercase: { regex: /[A-Z]/, element: document.getElementById('req-uppercase') },
                    lowercase: { regex: /[a-z]/, element: document.getElementById('req-lowercase') },
                    number: { regex: /[0-9]/, element: document.getElementById('req-number') },
                    special: { regex: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/, element: document.getElementById('req-special') }
                };

                function validatePassword() {
                    const password = passwordInput.value;
                    let allValid = true;

                    for (const [key, req] of Object.entries(requirements)) {
                        const isValid = req.regex.test(password);
                        if (isValid) {
                            req.element.style.color = '#28a745';
                            req.element.querySelector('.req-icon').textContent = '✓';
                        } else {
                            req.element.style.color = '#dc3545';
                            req.element.querySelector('.req-icon').textContent = '✗';
                            allValid = false;
                        }
                    }

                    return allValid;
                }

                passwordInput.addEventListener('input', function () {
                    validatePassword();
                });
            </script>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                ¿Ya tienes cuenta? <a th:href="@{/auth/login}" style="color: var(--primary); font-weight: 600;">Inicia
                    Sesión</a>
            </div>
        </div>
    </section>
</body>

</html>
