<html xmlns:th="http://www.thymeleaf.org" th:replace="~{vistas/Inicio :: layout(~{::section})}">
<section class="auth-container">
    <div class="auth-card">
        <a th:href="@{/auth/login}"
            style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--secondary); margin-bottom: 1.5rem; font-size: 0.9rem; font-weight: 500;">
            <i data-lucide="arrow-left" style="width: 16px;"></i> Volver al Login
        </a>

        <div class="auth-header">
            <div style="color: var(--primary); margin-bottom: 1rem;">
                <i data-lucide="lock" style="width: 48px; height: 48px;"></i>
            </div>
            <h1 class="auth-title">Nueva Contraseña</h1>
            <p style="color: var(--secondary);">Ingresa tu nueva contraseña segura</p>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <i data-lucide="alert-circle" style="width: 1rem; display: inline; vertical-align: middle;"></i>
            <span th:text="${error}">Error message</span>
        </div>

        <form th:action="@{/auth/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="form-group">
                <label for="newPassword" class="form-label">Nueva Contraseña</label>
                <input type="password" id="newPassword" name="newPassword" class="form-input"
                    placeholder="Mínimo 8 caracteres" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Repetir Contraseña</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                    placeholder="Repite tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Cambiar Contraseña
            </button>
        </form>
    </div>
</section>

</html>
