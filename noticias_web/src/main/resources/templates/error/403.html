<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Acceso Denegado - NoticiasApp</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: var(--danger);
            margin: 0;
        }

        .error-message {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: var(--text);
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1 class="error-code">403</h1>
        <p class="error-message">No tienes permisos para acceder a esta página.</p>
        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary">Volver al Inicio</a>
            <a th:href="@{/auth/login}" class="btn btn-outline">Ir al Login</a>
        </div>
    </div>
</body>

</html>
