<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{vistas/Inicio :: layout(~{::section})}">

<head>
    <title>Subir Noticia - NoticiasApp</title>
</head>

<body>
    <section class="container" style="max-width: 800px; margin: 3rem auto;">
        <div
            style="background: var(--card-bg); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border);">
            <div style="margin-bottom: 2rem;">
                <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Publicar Nueva Noticia</h1>
                <p style="color: var(--text-muted);">Completa el formulario para subir tu noticia. Todo el contenido
                    será revisado por IA.</p>
            </div>

            <div th:if="${error}" class="alert alert-danger" style="margin-bottom: 1.5rem;">
                <span th:text="${error}">Error al publicar</span>
            </div>

            <form th:action="@{/trabajador/publicar}" method="post" enctype="multipart/form-data">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="titulo" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Título</label>
                    <input type="text" id="titulo" name="titulo" required class="form-control"
                        placeholder="Escribe un título llamativo"
                        style="width: 100%; padding: 0.8rem; border-radius: var(--radius); border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text);">
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="subtitulo" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Subtítulo /
                        Resumen</label>
                    <input type="text" id="subtitulo" name="subtitulo" required class="form-control"
                        placeholder="Un breve resumen de la noticia.."
                        style="width: 100%; padding: 0.8rem; border-radius: var(--radius); border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text);">
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="categoriaId"
                        style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Categoría</label>
                    <select id="categoriaId" name="categoriaId" required class="form-control"
                        style="width: 100%; padding: 0.8rem; border-radius: var(--radius); border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text);">
                        <option value="" disabled selected>Selecciona una categoría</option>

                        <!-- CATEGORIES -->
                        <th:block
                            th:if="${session.usuario != null and (#strings.equalsIgnoreCase(session.usuario.rolNombre, 'OWNER') or #strings.equalsIgnoreCase(session.usuario.rolNombre, 'ADMIN') or #strings.equalsIgnoreCase(session.usuario.rolNombre, 'TRABAJADOR'))}">
                            <optgroup label="📰 Categorías">
                                <option value="5">Moviles</option>
                                <option value="6">IA</option>
                                <option value="7">Hardware</option>
                                <option value="8">Futbol</option>
                                <option value="9">Baloncesto</option>
                                <option value="3">Politica</option>
                                <option value="4">Cultura</option>
                            </optgroup>
                        </th:block>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="file" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Imagen
                        (Opcional)</label>
                    <div style="border: 2px dashed var(--border); padding: 2rem; text-align: center; border-radius: var(--radius); cursor: pointer;"
                        onclick="document.getElementById('file').click()">
                        <p style="color: var(--text-muted); margin-bottom: 0.5rem;">Haz clic para seleccionar una imagen
                        </p>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Formatos: JPEG, PNG, WebP, AVIF (máx.
                            5MB)</p>
                        <input type="file" id="file" name="file"
                            accept="image/jpeg,image/jpg,image/png,image/webp,image/avif" style="display: none;"
                            onchange="previewImage(this)">
                        <div id="image-preview-container" style="margin-top: 1rem; display: none;">
                            <img id="image-preview" src="#" alt="Vista previa"
                                style="max-width: 100%; max-height: 300px; border-radius: var(--radius); box-shadow: var(--shadow-sm);">
                            <p id="file-info"
                                style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--text-muted);"></p>
                        </div>
                        <p id="file-name" class="file-name"
                            style="margin-top: 0.5rem; font-weight: 600; color: var(--primary);"></p>
                        <p id="file-error" style="margin-top: 0.5rem; color: #ef4444; font-weight: 600; display: none;">
                        </p>

                        <!-- Progress Bar -->
                        <div id="upload-progress-container" style="display: none; margin-top: 1rem;">
                            <div style="background: #e2e8f0; border-radius: 9999px; height: 8px; overflow: hidden;">
                                <div id="upload-progress-bar"
                                    style="background: linear-gradient(90deg, #3b82f6, #2563eb); height: 100%; width: 0%; transition: width 0.3s ease;">
                                </div>
                            </div>
                            <p id="upload-progress-text"
                                style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--primary); font-weight: 600;">
                            </p>
                        </div>
                    </div>
                </div>

                <script>
                    function previewImage(input) {
                        const previewContainer = document.getElementById('image-preview-container');
                        const previewImage = document.getElementById('image-preview');
                        const fileName = document.getElementById('file-name');
                        const fileInfo = document.getElementById('file-info');
                        const fileError = document.getElementById('file-error');

                        // Reset error
                        fileError.style.display = 'none';
                        fileError.textContent = '';

                        if (input.files && input.files[0]) {
                            const file = input.files[0];
                            const maxSize = 5 * 1024 * 1024; // 5MB
                            const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp', 'image/avif'];

                            console.log('File selected:', file.name, 'Type:', file.type, 'Size:', file.size);

                            // Validate file type
                            if (!allowedTypes.includes(file.type)) {
                                fileError.textContent = '❌ Formato no permitido. Solo JPEG, PNG, WebP o AVIF.';
                                fileError.style.display = 'block';
                                fileName.textContent = '';
                                previewContainer.style.display = 'none';
                                input.value = ''; // Clear input
                                return;
                            }

                            // Validate file size
                            if (file.size > maxSize) {
                                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                                fileError.textContent = `❌ Archivo demasiado grande (${sizeMB}MB). Máximo 5MB.`;
                                fileError.style.display = 'block';
                                fileName.textContent = '';
                                previewContainer.style.display = 'none';
                                input.value = ''; // Clear input
                                return;
                            }

                            // Display file info
                            fileName.textContent = '✓ ' + file.name;
                            const sizeKB = (file.size / 1024).toFixed(2);
                            fileInfo.textContent = `Tamaño: ${sizeKB} KB | Tipo: ${file.type.split('/')[1].toUpperCase()}`;

                            // Preview image
                            if (file.type.startsWith('image/')) {
                                const reader = new FileReader();
                                reader.onload = function (e) {
                                    previewImage.src = e.target.result;
                                    previewContainer.style.display = 'block';

                                    // Get image dimensions
                                    const img = new Image();
                                    img.onload = function () {
                                        fileInfo.textContent += ` | Dimensiones: ${this.width}x${this.height}px`;
                                        console.log('Image dimensions:', this.width, 'x', this.height);
                                    };
                                    img.src = e.target.result;
                                }
                                reader.readAsDataURL(file);
                            } else {
                                previewContainer.style.display = 'none';
                            }
                        }
                    }

                    // Handle form submission with progress
                    document.addEventListener('DOMContentLoaded', function () {
                        const form = document.querySelector('form[action*="publicar"]');
                        if (!form) return;

                        form.addEventListener('submit', function (e) {
                            const fileInput = document.getElementById('file');
                            const submitBtn = form.querySelector('button[type="submit"]');
                            const progressContainer = document.getElementById('upload-progress-container');
                            const progressBar = document.getElementById('upload-progress-bar');
                            const progressText = document.getElementById('upload-progress-text');

                            if (fileInput && fileInput.files && fileInput.files[0]) {
                                console.log('Submitting form with file:', fileInput.files[0].name);

                                // Show progress bar
                                progressContainer.style.display = 'block';
                                progressBar.style.width = '0%';
                                progressText.textContent = 'Subiendo imagen...';

                                // Disable submit button
                                submitBtn.disabled = true;
                                submitBtn.textContent = 'Subiendo...';

                                // Simulate progress (since we can't track actual upload progress with form submission)
                                let progress = 0;
                                const interval = setInterval(() => {
                                    progress += 10;
                                    if (progress <= 90) {
                                        progressBar.style.width = progress + '%';
                                        progressText.textContent = `Subiendo imagen... ${progress}%`;
                                    }
                                }, 200);

                                // Clear interval after 3 seconds (form should have submitted by then)
                                setTimeout(() => clearInterval(interval), 3000);
                            } else {
                                console.log('Submitting form without file');
                            }
                        });
                    });
                </script>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label for="contenido" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Descripción
                        / Contenido</label>
                    <textarea id="contenido" name="contenido" rows="10" required maxlength="5000"
                        placeholder="Escribe el cuerpo de la noticia aquí..."
                        style="width: 100%; padding: 0.8rem; border-radius: var(--radius); border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text); resize: vertical;"></textarea>
                    <small style="color: var(--text-muted); float: right;">Max 5000 caracteres</small>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <a th:href="@{/}" class="btn btn-ghost"
                        style="padding: 0.8rem; text-decoration: none; color: var(--text);">Cancelar</a>
                    <button type="submit" class="btn btn-primary"
                        style="padding: 0.8rem 1.5rem; background: var(--primary); color: white; border: none; border-radius: var(--radius); cursor: pointer;">Publicar
                        Noticia</button>
                </div>
            </form>
        </div>
    </section>
</body>

</html>
