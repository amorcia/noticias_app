<html xmlns:th="http://www.thymeleaf.org" th:replace="~{vistas/Inicio :: layout(~{::section})}">
<section class="auth-container">
    <div class="auth-card">
        <a th:href="@{/auth/login}"
            style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--secondary); margin-bottom: 1.5rem; font-size: 0.9rem; font-weight: 500;">
            <i data-lucide="arrow-left" style="width: 16px;"></i> Volver
        </a>

        <div class="auth-header">
            <div style="color: var(--primary); margin-bottom: 1rem;">
                <i data-lucide="key" style="width: 48px; height: 48px;"></i>
            </div>
            <h1 class="auth-title">Recuperar Contraseña</h1>
            <p style="color: var(--secondary);">Ingresa tu correo y te enviaremos un código de recuperación</p>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <i data-lucide="alert-circle" style="width: 1rem; display: inline; vertical-align: middle;"></i>
            <span th:text="${error}">Error message</span>
        </div>

        <div th:if="${mensaje}" class="alert alert-success">
            <i data-lucide="check-circle" style="width: 1rem; display: inline; vertical-align: middle;"></i>
            <span th:text="${mensaje}">Success message</span>
        </div>

        <form th:action="@{/auth/olvidar}" method="post">
            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Enviar Código
            </button>
        </form>
    </div>
</section>

</html>
