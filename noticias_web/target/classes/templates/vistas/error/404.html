<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{vistas/Inicio :: layout(~{::section})}">

<body>
    <section>
        <div class="container fade-in"
            style="padding: 4rem 2rem; text-align: center; min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div
                style="background: var(--surface); padding: 3rem; border-radius: 1.5rem; border: 1px solid var(--border); box-shadow: var(--shadow-lg); max-width: 600px; width: 100%;">
                <div style="margin-bottom: 2rem;">
                    <i data-lucide="search" style="width: 80px; height: 80px; color: var(--primary);"></i>
                </div>
                <h1 style="font-size: 3rem; font-weight: 800; margin-bottom: 1rem; color: var(--text-main);">No
                    Encontrado</h1>
                <h2 style="font-size: 1.5rem; color: var(--text-muted); margin-bottom: 1.5rem;">Error 404</h2>
                <p style="color: var(--text-muted); margin-bottom: 2rem; line-height: 1.6;">La página que estás buscando
                    se ha esfumado o nunca existió.</p>
                <div style="display: flex; gap: 1rem; justify-content: center;">
                    <a th:href="@{/}" class="btn btn-primary"
                        style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
                        <i data-lucide="home" style="width: 18px;"></i> Volver al Inicio
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
