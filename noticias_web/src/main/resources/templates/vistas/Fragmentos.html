<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <header class="main-header" th:fragment="header">
        <nav class="nav-container">
            <a th:href="@{/}" class="logo">
                <i data-lucide="newspaper"></i>
                NoticiasApp
            </a>

            <div class="nav-links">
                <a th:href="@{/}" class="nav-link">Inicio</a>

                <!-- Dropdown Categorías -->
                <div class="dropdown">
                    <a href="#" class="nav-link">
                        Categorías <i data-lucide="chevron-down" style="width: 14px; display: inline;"></i>
                    </a>
                    <div class="dropdown-menu" style="min-width: 200px;">
                        <div class="dropdown-header"
                            style="padding: 0.5rem 1rem; font-weight: 700; color: var(--text-main); font-size: 0.9rem;">
                            Tecnología</div>
                        <a th:href="@{/categoria/Moviles}" class="dropdown-item"
                            style="padding-left: 1.5rem;">Móviles</a>
                        <a th:href="@{/categoria/IA}" class="dropdown-item" style="padding-left: 1.5rem;">IA</a>
                        <a th:href="@{/categoria/Hardware}" class="dropdown-item"
                            style="padding-left: 1.5rem;">Hardware</a>

                        <div class="dropdown-header"
                            style="padding: 0.5rem 1rem; font-weight: 700; color: var(--text-main); font-size: 0.9rem; margin-top: 0.5rem;">
                            Deportes</div>
                        <a th:href="@{/categoria/Futbol}" class="dropdown-item" style="padding-left: 1.5rem;">Fútbol</a>
                        <a th:href="@{/categoria/Baloncesto}" class="dropdown-item"
                            style="padding-left: 1.5rem;">Baloncesto</a>

                        <div style="border-top: 1px solid var(--border); margin: 0.5rem 0;"></div>
                        <a th:href="@{/categoria/Politica}" class="dropdown-item">Política</a>
                        <a th:href="@{/categoria/Cultura}" class="dropdown-item">Cultura</a>
                    </div>
                </div>

                <!-- Dropdown Vuestras Noticias -->
                <div class="dropdown">
                    <a href="#" class="nav-link">
                        Vuestras Noticias <i data-lucide="chevron-down" style="width: 14px; display: inline;"></i>
                    </a>
                    <div class="dropdown-menu" style="min-width: 200px;">
                        <div class="dropdown-header"
                            style="padding: 0.5rem 1rem; font-weight: 700; color: var(--text-main); font-size: 0.9rem;">
                            Tecnología</div>
                        <a th:href="@{/foro/Moviles}" class="dropdown-item" style="padding-left: 1.5rem;">Móviles</a>
                        <a th:href="@{/foro/IA}" class="dropdown-item" style="padding-left: 1.5rem;">IA</a>
                        <a th:href="@{/foro/Hardware}" class="dropdown-item" style="padding-left: 1.5rem;">Hardware</a>

                        <div class="dropdown-header"
                            style="padding: 0.5rem 1rem; font-weight: 700; color: var(--text-main); font-size: 0.9rem; margin-top: 0.5rem;">
                            Deportes</div>
                        <a th:href="@{/foro/Futbol}" class="dropdown-item" style="padding-left: 1.5rem;">Fútbol</a>
                        <a th:href="@{/foro/Baloncesto}" class="dropdown-item"
                            style="padding-left: 1.5rem;">Baloncesto</a>

                        <div style="border-top: 1px solid var(--border); margin: 0.5rem 0;"></div>
                        <a th:href="@{/foro/Politica}" class="dropdown-item">Política</a>
                        <a th:href="@{/foro/Cultura}" class="dropdown-item">Cultura</a>
                    </div>
                </div>
            </div>

            <div class="nav-actions">
                <!-- Botón Subir (Siempre visible si trabajador/admin) -->
                <a th:if="${session.usuario != null and (#strings.equalsIgnoreCase(session.usuario.rolNombre, 'TRABAJADOR') or #strings.equalsIgnoreCase(session.usuario.rolNombre, 'ADMIN') or #strings.equalsIgnoreCase(session.usuario.rolNombre, 'OWNER'))}"
                    th:href="@{/trabajador/subir-noticia}" class="btn btn-primary btn-sm">
                    <i data-lucide="upload" style="width: 16px; height: 16px; margin-right: 5px;"></i>
                    Subir
                </a>

                <div class="user-dropdown" th:if="${session.usuario != null}">
                    <button class="user-dropdown-btn">
                        <img th:src="${session.usuario.imagenUrl != null ? session.usuario.imagenUrl : 'https://ui-avatars.com/api/?name=' + session.usuario.nombreCompleto + '&background=0D6EFD&color=fff'}"
                            class="user-avatar" alt="Avatar">
                    </button>
                    <div class="dropdown-menu">
                        <a th:href="@{/perfil}" class="dropdown-item">
                            <i data-lucide="user" style="width: 16px; height: 16px; margin-right: 0.5rem;"></i>
                            Mi Perfil
                        </a>
                        <a th:href="@{/ajustes}" class="dropdown-item">
                            <i data-lucide="settings" style="width: 16px; height: 16px; margin-right: 0.5rem;"></i>
                            Ajustes
                        </a>

                        <a th:if="${#strings.equalsIgnoreCase(session.usuario.rolNombre, 'ADMIN') or #strings.equalsIgnoreCase(session.usuario.rolNombre, 'OWNER')}"
                            th:href="@{/admin/panel}" class="dropdown-item"
                            style="color: var(--primary); font-weight: 500;">
                            <i data-lucide="lock" style="width: 16px; height: 16px; margin-right: 0.5rem;"></i>
                            Panel Admin
                        </a>

                        <div style="border-top: 1px solid var(--border); margin: 0.5rem 0;"></div>

                        <a th:href="@{/auth/logout}" class="dropdown-item" style="color: var(--danger);">
                            <i data-lucide="log-out" style="width: 16px; height: 16px; margin-right: 0.5rem;"></i>
                            Cerrar Sesión
                        </a>
                    </div>
                </div>

                <div class="auth-buttons" th:if="${session.usuario == null}">
                    <a th:href="@{/auth/login}" class="btn btn-ghost">Iniciar Sesión</a>
                    <a th:href="@{/auth/registro}" class="btn btn-primary"
                        style="padding: 0.5rem 1rem; font-size: 0.9rem;">Registrarse</a>
                </div>
            </div>
        </nav>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof lucide !== 'undefined') lucide.createIcons();

                // User Dropdown toggle
                const userBtn = document.querySelector('.user-dropdown-btn');
                if (userBtn) {
                    userBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const dropdown = userBtn.closest('.user-dropdown');
                        dropdown.classList.toggle('active');

                        // FORCE ICON RENDER when opening
                        if (dropdown.classList.contains('active') && typeof lucide !== 'undefined') {
                            lucide.createIcons();
                        }

                        // Close other nav dropdowns
                        document.querySelectorAll('.dropdown.active').forEach(d => d.classList.remove('active'));
                    });
                }

                // Nav Dropdowns (Categorias, Foro)
                document.querySelectorAll('.dropdown .nav-link').forEach(link => {
                    link.addEventListener('click', (e) => {
                        const dropdown = link.closest('.dropdown');
                        if (dropdown) {
                            e.preventDefault();
                            e.stopPropagation();
                            dropdown.classList.toggle('active');

                            // FORCE ICON RENDER when opening
                            if (dropdown.classList.contains('active') && typeof lucide !== 'undefined') {
                                lucide.createIcons();
                            }

                            // Close user dropdown if open
                            document.querySelector('.user-dropdown.active')?.classList.remove('active');
                            // Close other nav dropdowns
                            document.querySelectorAll('.dropdown.active').forEach(d => {
                                if (d !== dropdown) d.classList.remove('active');
                            });
                        }
                    });
                });

                window.addEventListener('click', () => {
                    document.querySelectorAll('.dropdown.active, .user-dropdown.active').forEach(d => d.classList.remove('active'));
                });
            });
        </script>

        <!-- Global Settings Script - Applies to ALL views -->
        <script th:src="@{/js/settings.js}"></script>
    </header>

</body>

</html>
