<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Noticias App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="text-center max-w-lg px-6 w-full">
        <!-- Icono de Alerta -->
        <div class="flex justify-center mb-6">
            <!-- Icono similar al de la imagen proporcionada -->
            <i data-lucide="triangle-alert" class="w-20 h-20 text-red-500 fill-red-50"></i>
        </div>

        <h1 class="text-3xl font-bold text-gray-900 mb-2">Algo salió mal</h1>
        <p class="text-gray-600 mb-8">
            Ha ocurrido un error, inténtelo de nuevo más tarde.
        </p>

        <!-- Detalle del error (Opcional, si está disponible) -->
        <div th:if="${error} or ${message} or ${status}"
            class="mb-8 bg-red-50 border border-red-100 rounded-lg p-4 text-left">
            <p class="text-sm text-red-800 font-medium">
                <span class="font-bold">Detalle del error:</span>
                <span th:text="${error} ?: (${message} ?: 'Error desconocido')">Error info</span>
            </p>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="/"
                class="w-full sm:w-auto inline-flex items-center justify-center px-6 py-3 border border-transparent text-base font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors shadow-sm">
                Volver al Inicio
            </a>

            <a href="/" class="text-gray-600 hover:text-gray-900 font-medium text-sm">
                Intentar de nuevo
            </a>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
