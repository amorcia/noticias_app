<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{vistas/Inicio :: layout(~{::section})}">

<head>
    <title th:text="${categoriaNombre} + ' - NoticiasApp'">Categoría - NoticiasApp</title>
</head>

<body>
    <section>
        <main class="container" style="max-width: 1200px; margin: 0 auto; padding: 1rem 0;">
            <!-- Category Header -->
            <div
                style="margin-bottom: 3rem; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1rem; border-bottom: 2px solid var(--border); padding-bottom: 1.5rem;">
                <div>
                    <h1 style="font-size: 3rem; font-weight: 950; letter-spacing: -1px; margin-bottom: 0.5rem; color: var(--text-main);"
                        th:text="${categoriaNombre}">Categoría</h1>
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <span class="badge" th:text="${esForo ? 'FORO COMUNITARIO' : 'SECCIÓN OFICIAL'}"
                            style="background-color: var(--primary); color: white; padding: 0.4rem 1rem; border-radius: 2rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;"></span>
                        <span style="color: var(--text-muted); font-size: 0.9rem;"
                            th:text="${noticias.size()} + ' noticias publicadas'"></span>
                    </div>
                </div>
                <a th:href="@{/}"
                    style="color: var(--text-muted); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 0.4rem;">
                    <i data-lucide="chevron-left" style="width: 18px;"></i> Volver
                </a>
            </div>

            <!-- News Sections -->
            <div style="display: flex; flex-direction: column; gap: 4rem;">

                <!-- Section: Tendencias (Top 5 mejor reaccionadas de esta categoría) -->
                <section th:if="${tendencias != null and !tendencias.empty}">
                    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
                        <div
                            style="background: var(--primary); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px -1px rgba(13, 110, 253, 0.3);">
                            <i data-lucide="flame" style="width: 22px;"></i>
                        </div>
                        <h2 style="font-size: 2rem; font-weight: 900; margin: 0; letter-spacing: -0.5px;">Tendencias en
                            <span th:text="${categoriaNombre}">Categoría</span></h2>
                    </div>

                    <div
                        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem;">
                        <article class="news-card-premium" th:each="noticia, iter : ${tendencias}"
                            style="background: var(--surface); border: 1px solid var(--border); border-radius: 1.5rem; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s ease; transform: translateY(0);"
                            onmouseover="this.style.transform='translateY(-8px)'; this.style.borderColor='var(--primary)';"
                            onmouseout="this.style.transform='translateY(0)'; this.style.borderColor='var(--border)';"
                            th:if="${iter.index < 5}">

                            <!-- Large Rank Image -->
                            <div style="position: relative; height: 200px; overflow: hidden;">
                                <div
                                    style="position: absolute; top: 1.5rem; right: 1.5rem; z-index: 10; background: rgba(13, 110, 253, 0.95); color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.25rem; backdrop-filter: blur(4px);">
                                    #<span th:text="${iter.count}">1</span>
                                </div>
                                <img th:src="${noticia.imagenUrl != null and !noticia.imagenUrl.empty ? noticia.imagenUrl : 'https://placehold.co/600x400/f1f5f9/64748b?text=Noticia'}"
                                    alt="Tendencia" style="width: 100%; height: 100%; object-fit: cover;">
                            </div>

                            <div style="padding: 1.5rem; flex: 1; display: flex; flex-direction: column;">
                                <h3
                                    style="font-size: 1.4rem; font-weight: 800; line-height: 1.3; margin-bottom: 0.75rem;">
                                    <a th:href="@{'/noticia/' + ${noticia.id}}" th:text="${noticia.titulo}"
                                        style="text-decoration: none; color: var(--text-main);"></a>
                                </h3>
                                <div
                                    style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 1rem;">
                                    <div
                                        style="display: flex; align-items: center; gap: 0.5rem; color: var(--primary); font-weight: 700;">
                                        <i data-lucide="thumbs-up" style="width: 18px;"></i>
                                        <span th:text="${noticia.likes}">0</span>
                                    </div>
                                    <span style="font-size: 0.85rem; color: var(--text-muted);"
                                        th:text="${#temporals.format(noticia.fechaPublicacion, 'dd MMM')}"></span>
                                </div>
                            </div>
                        </article>
                    </div>
                </section>

                <!-- Section: Novedades (Últimas noticias de la categoría) -->
                <section>
                    <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
                        <div
                            style="background: #f1f5f9; color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border);">
                            <i data-lucide="clock" style="width: 20px;"></i>
                        </div>
                        <h2 style="font-size: 2rem; font-weight: 900; margin: 0; letter-spacing: -0.5px;">Últimas
                            Novedades</h2>
                    </div>

                    <div class="news-grid"
                        style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem;">
                        <article class="news-card-premium" th:each="noticia : ${noticias}">
                            <!-- Contenido existente de la card simplificado de Categoria.html actual -->
                            <div class="card-image"
                                th:if="${noticia.imagenUrl != null and !noticia.imagenUrl.isEmpty()}"
                                style="width: 100%; height: 200px; overflow: hidden; position: relative;">
                                <img th:src="${noticia.imagenUrl}" onerror="this.parentElement.style.display='none'"
                                    alt="Noticia"
                                    style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s;">
                            </div>
                            <div th:unless="${noticia.imagenUrl != null and !noticia.imagenUrl.isEmpty()}"
                                style="width: 100%; height: 160px; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border);">
                                <i data-lucide="newspaper" style="width: 40px; height: 40px; color: var(--border);"></i>
                            </div>

                            <div class="premium-content"
                                style="padding: 1.5rem; flex: 1; display: flex; flex-direction: column;">
                                <div class="card-meta"
                                    style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
                                    <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;"
                                        th:text="${#temporals.format(noticia.fechaPublicacion, 'dd MMM, yyyy')}"></span>
                                    <div
                                        style="display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; color: var(--text-muted);">
                                        <i data-lucide="user" style="width: 12px;"></i>
                                        <span th:text="${noticia.autorNombre}"></span>
                                    </div>
                                </div>

                                <h3
                                    style="font-size: 1.25rem; font-weight: 700; line-height: 1.4; margin-bottom: 0.5rem;">
                                    <a th:href="@{'/noticia/' + ${noticia.id}}" th:text="${noticia.titulo}"
                                        style="text-decoration: none; color: var(--text-main);"></a>
                                </h3>

                                <div
                                    style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding-top: 1rem; border-top: 1px solid var(--border);">
                                    <div style="display: flex; gap: 0.5rem;">
                                        <div
                                            style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.85rem; color: var(--text-muted);">
                                            <i data-lucide="thumbs-up" style="width: 14px;"></i>
                                            <span th:text="${noticia.likes}"></span>
                                        </div>
                                        <div
                                            style="display: flex; align-items: center; gap: 0.25rem; font-size: 0.85rem; color: var(--text-muted);">
                                            <i data-lucide="message-circle" style="width: 14px;"></i>
                                            <span th:text="${noticia.comentariosCount}"></span>
                                        </div>
                                    </div>
                                    <button th:onclick="'openReportModal(' + ${noticia.id} + ')'"
                                        style="background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.25rem;">
                                        <i data-lucide="flag" style="width: 14px;"></i>
                                    </button>
                                </div>
                            </div>
                        </article>
                    </div>

                    <!-- Empty State (Inside Novedades) -->
                    <div th:if="${noticias == null or noticias.empty}"
                        style="padding: 4rem 2rem; text-align: center; background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius);">
                        <i data-lucide="newspaper"
                            style="width: 48px; height: 48px; margin: 0 auto 1rem; color: var(--border);"></i>
                        <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--text-muted);">No hay novedades
                        </h3>
                        <p style="color: var(--text-muted);">Publica algo nuevo para verlo aquí.</p>
                    </div>
                </section>
            </div>
        </main>
    </section>
</body>

</html>
