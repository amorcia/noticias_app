<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes - NoticiasApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <header th:replace="~{vistas/Fragmentos :: header}"></header>

        <main class="container" style="padding: 2rem 1rem; max-width: 800px; margin: 0 auto;">
            <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 2rem;">
                <i data-lucide="settings"
                    style="width: 32px; height: 32px; display: inline-block; vertical-align: middle;"></i>
                Ajustes
            </h1>

            <!-- Settings Sections -->
            <div style="display: flex; flex-direction: column; gap: 2rem;">

                <!-- Appearance Section -->
                <section class="settings-section"
                    style="background: var(--surface); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border);">
                    <h2
                        style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                        <i data-lucide="palette" style="width: 24px; height: 24px;"></i>
                        Apariencia
                    </h2>

                    <!-- Theme Toggle -->
                    <div class="setting-item" style="margin-bottom: 2rem;">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <label style="font-weight: 600; font-size: 1rem;">Tema</label>
                            <div class="theme-toggle"
                                style="display: flex; gap: 0.5rem; background: var(--bg); padding: 0.25rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                                <button id="lightThemeBtn" class="theme-btn active" data-theme="light"
                                    style="padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; background: transparent; transition: all 0.2s;">
                                    <i data-lucide="sun" style="width: 16px; height: 16px;"></i>
                                    Claro
                                </button>
                                <button id="darkThemeBtn" class="theme-btn" data-theme="dark"
                                    style="padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; background: transparent; transition: all 0.2s;">
                                    <i data-lucide="moon" style="width: 16px; height: 16px;"></i>
                                    Oscuro
                                </button>
                            </div>
                        </div>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Elige entre tema claro u oscuro</p>
                    </div>

                    <!-- Primary Color -->
                    <div class="setting-item" style="margin-bottom: 2rem;">
                        <label style="font-weight: 600; font-size: 1rem; display: block; margin-bottom: 0.75rem;">Color
                            Principal</label>
                        <div
                            style="display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 0.75rem;">
                            <button class="color-option active" data-color="#2563EB"
                                style="width: 60px; height: 60px; border-radius: 0.5rem; border: 3px solid transparent; cursor: pointer; background: #2563EB; transition: all 0.2s; position: relative;">
                                <i data-lucide="check"
                                    style="width: 24px; height: 24px; color: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none;"></i>
                            </button>
                            <button class="color-option" data-color="#7C3AED"
                                style="width: 60px; height: 60px; border-radius: 0.5rem; border: 3px solid transparent; cursor: pointer; background: #7C3AED; transition: all 0.2s;"></button>
                            <button class="color-option" data-color="#DB2777"
                                style="width: 60px; height: 60px; border-radius: 0.5rem; border: 3px solid transparent; cursor: pointer; background: #DB2777; transition: all 0.2s;"></button>
                            <button class="color-option" data-color="#DC2626"
                                style="width: 60px; height: 60px; border-radius: 0.5rem; border: 3px solid transparent; cursor: pointer; background: #DC2626; transition: all 0.2s;"></button>
                            <button class="color-option" data-color="#EA580C"
                                style="width: 60px; height: 60px; border-radius: 0.5rem; border: 3px solid transparent; cursor: pointer; background: #EA580C; transition: all 0.2s;"></button>
                            <button class="color-option" data-color="#16A34A"
                                style="width: 60px; height: 60px; border-radius: 0.5rem; border: 3px solid transparent; cursor: pointer; background: #16A34A; transition: all 0.2s;"></button>
                            <button class="color-option" data-color="#0891B2"
                                style="width: 60px; height: 60px; border-radius: 0.5rem; border: 3px solid transparent; cursor: pointer; background: #0891B2; transition: all 0.2s;"></button>
                            <button class="color-option" data-color="#4F46E5"
                                style="width: 60px; height: 60px; border-radius: 0.5rem; border: 3px solid transparent; cursor: pointer; background: #4F46E5; transition: all 0.2s;"></button>
                        </div>
                        <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.75rem;">Personaliza el
                            color de los botones y enlaces</p>
                    </div>
                </section>

                <!-- Language Section -->
                <section class="settings-section"
                    style="background: var(--surface); padding: 2rem; border-radius: var(--radius); border: 1px solid var(--border);">
                    <h2
                        style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                        <i data-lucide="languages" style="width: 24px; height: 24px;"></i>
                        Idioma
                    </h2>

                    <div class="setting-item">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <label style="font-weight: 600; font-size: 1rem;">Idioma de la Interfaz</label>
                            <div class="language-toggle"
                                style="display: flex; gap: 0.5rem; background: var(--bg); padding: 0.25rem; border-radius: 0.5rem; border: 1px solid var(--border);">
                                <button id="esLangBtn" class="lang-btn active" data-lang="es"
                                    style="padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; background: transparent; transition: all 0.2s;">
                                    🇪🇸 Español
                                </button>
                                <button id="enLangBtn" class="lang-btn" data-lang="en"
                                    style="padding: 0.5rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; background: transparent; transition: all 0.2s;">
                                    🇬🇧 English
                                </button>
                            </div>
                        </div>
                        <p style="color: var(--text-muted); font-size: 0.875rem;">Cambia el idioma de toda la aplicación
                        </p>
                    </div>
                </section>

                <!-- Save Button -->
                <div style="display: flex; justify-content: flex-end; gap: 1rem;">
                    <a th:href="@{/perfil}" class="btn btn-ghost"
                        style="padding: 0.75rem 1.5rem; text-decoration: none;">Cancelar</a>
                    <button id="saveSettingsBtn" class="btn btn-primary"
                        style="padding: 0.75rem 2rem; display: flex; align-items: center; gap: 0.5rem;">
                        <i data-lucide="save" style="width: 18px; height: 18px;"></i>
                        Guardar Cambios
                    </button>
                </div>
            </div>
        </main>

        <footer class="main-footer"
            style="padding: 2rem; text-align: center; border-top: 1px solid var(--border); margin-top: auto;">
            <p>&copy; 2025 NoticiasApp</p>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        // Load saved settings
        const savedTheme = localStorage.getItem('theme') || 'light';
        const savedColor = localStorage.getItem('primaryColor') || '#2563EB';
        const savedLang = localStorage.getItem('language') || 'es';

        // Apply saved settings
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.style.setProperty('--primary', savedColor);

        // Update UI to reflect saved settings
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === savedTheme);
            if (btn.classList.contains('active')) {
                btn.style.background = 'var(--primary)';
                btn.style.color = 'white';
            }
        });

        document.querySelectorAll('.color-option').forEach(btn => {
            const isActive = btn.dataset.color === savedColor;
            btn.classList.toggle('active', isActive);
            btn.style.borderColor = isActive ? savedColor : 'transparent';
            btn.style.transform = isActive ? 'scale(1.1)' : 'scale(1)';
            const check = btn.querySelector('i');
            if (check) check.style.display = isActive ? 'block' : 'none';
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === savedLang);
            if (btn.classList.contains('active')) {
                btn.style.background = 'var(--primary)';
                btn.style.color = 'white';
            }
        });

        // Theme toggle
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                document.documentElement.setAttribute('data-theme', theme);

                document.querySelectorAll('.theme-btn').forEach(b => {
                    b.classList.remove('active');
                    b.style.background = 'transparent';
                    b.style.color = 'var(--text-main)';
                });
                btn.classList.add('active');
                btn.style.background = 'var(--primary)';
                btn.style.color = 'white';

                lucide.createIcons();
            });
        });

        // Color selection
        document.querySelectorAll('.color-option').forEach(btn => {
            btn.addEventListener('click', () => {
                const color = btn.dataset.color;
                document.documentElement.style.setProperty('--primary', color);

                document.querySelectorAll('.color-option').forEach(b => {
                    b.classList.remove('active');
                    b.style.borderColor = 'transparent';
                    b.style.transform = 'scale(1)';
                    const check = b.querySelector('i');
                    if (check) check.style.display = 'none';
                });

                btn.classList.add('active');
                btn.style.borderColor = color;
                btn.style.transform = 'scale(1.1)';
                const check = btn.querySelector('i');
                if (check) check.style.display = 'block';

                // Update active theme button color
                document.querySelectorAll('.theme-btn.active, .lang-btn.active').forEach(b => {
                    b.style.background = color;
                });
            });
        });

        // Language toggle
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.dataset.lang;

                document.querySelectorAll('.lang-btn').forEach(b => {
                    b.classList.remove('active');
                    b.style.background = 'transparent';
                    b.style.color = 'var(--text-main)';
                });
                btn.classList.add('active');
                btn.style.background = 'var(--primary)';
                btn.style.color = 'white';
            });
        });

        // Save settings
        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            const theme = document.querySelector('.theme-btn.active').dataset.theme;
            const color = document.querySelector('.color-option.active').dataset.color;
            const lang = document.querySelector('.lang-btn.active').dataset.lang;

            localStorage.setItem('theme', theme);
            localStorage.setItem('primaryColor', color);
            localStorage.setItem('language', lang);

            // Show success message
            const btn = document.getElementById('saveSettingsBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="check" style="width: 18px; height: 18px;"></i> ¡Guardado!';
            btn.style.background = '#16A34A';
            lucide.createIcons();

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.style.background = '';
                lucide.createIcons();
            }, 2000);
        });
    </script>
</body>

</html>
