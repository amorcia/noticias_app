<html xmlns:th="http://www.thymeleaf.org" th:replace="~{vistas/Inicio :: layout(~{::section})}">
<section class="auth-container">
    <div class="auth-card">
        <a th:href="@{/auth/olvidar}"
            style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--secondary); margin-bottom: 1.5rem; font-size: 0.9rem; font-weight: 500;">
            <i data-lucide="arrow-left" style="width: 16px;"></i> Volver
        </a>

        <div class="auth-header">
            <div style="color: var(--primary); margin-bottom: 1rem;">
                <i data-lucide="shield-check" style="width: 48px; height: 48px;"></i>
            </div>
            <h1 class="auth-title">Verificar Código</h1>
            <p style="color: var(--secondary);">Ingresa el código de 6 dígitos enviado a <span th:text="${email}"
                    style="font-weight: 600; color: var(--text-main);">tu correo</span></p>
        </div>

        <div th:if="${error}" class="alert alert-danger">
            <i data-lucide="alert-circle" style="width: 1rem; display: inline; vertical-align: middle;"></i>
            <span th:text="${error}">Error message</span>
        </div>

        <form th:action="@{/auth/verificar-codigo}" method="post" id="formCodigo" onsubmit="return validarCodigo()">
            <input type="hidden" name="email" th:value="${email}">

            <div class="form-group">
                <label class="form-label" style="text-align: center;">Código de Seguridad</label>
                <div style="display: flex; gap: 0.5rem; justify-content: center;">
                    <!-- Inputs visuales -->
                    <input type="text" class="form-input input-codigo" maxlength="1" pattern="[0-9]"
                        style="width: 3rem; text-align: center; font-size: 1.25rem; padding: 0.5rem;" required>
                    <input type="text" class="form-input input-codigo" maxlength="1" pattern="[0-9]"
                        style="width: 3rem; text-align: center; font-size: 1.25rem; padding: 0.5rem;" required>
                    <input type="text" class="form-input input-codigo" maxlength="1" pattern="[0-9]"
                        style="width: 3rem; text-align: center; font-size: 1.25rem; padding: 0.5rem;" required>
                    <input type="text" class="form-input input-codigo" maxlength="1" pattern="[0-9]"
                        style="width: 3rem; text-align: center; font-size: 1.25rem; padding: 0.5rem;" required>
                    <input type="text" class="form-input input-codigo" maxlength="1" pattern="[0-9]"
                        style="width: 3rem; text-align: center; font-size: 1.25rem; padding: 0.5rem;" required>
                    <input type="text" class="form-input input-codigo" maxlength="1" pattern="[0-9]"
                        style="width: 3rem; text-align: center; font-size: 1.25rem; padding: 0.5rem;" required>
                </div>
                <!-- Input real enviado -->
                <input type="hidden" id="codigo" name="codigo" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Verificar Código
            </button>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                <p style="color: var(--text-muted); margin-bottom: 0.5rem;">¿No recibiste el código?</p>
                <a th:href="@{/auth/olvidar}" style="color: var(--primary); font-weight: 600;">Reenviar código</a>
            </div>
        </form>
    </div>

    <script>
        // Auto-focus y auto-avance entre inputs de código
        const inputs = document.querySelectorAll('.input-codigo');
        const codigoHidden = document.getElementById('codigo');

        inputs.forEach((input, index) => {
            // Solo permitir números
            input.addEventListener('input', (e) => {
                // Eliminar cualquier caracter que no sea número
                e.target.value = e.target.value.replace(/[^0-9]/g, '');

                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                // Actualizar campo hidden con el código completo
                codigoHidden.value = Array.from(inputs).map(i => i.value).join('');
            });

            // Prevenir entrada de caracteres no numéricos
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Permitir pegar código completo
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
                const digits = pastedData.split('').slice(0, 6);

                digits.forEach((digit, i) => {
                    if (inputs[i]) {
                        inputs[i].value = digit;
                    }
                });

                // Actualizar campo hidden
                codigoHidden.value = Array.from(inputs).map(i => i.value).join('');

                // Focus en el siguiente input vacío o el último
                const nextEmpty = Array.from(inputs).findIndex(inp => !inp.value);
                if (nextEmpty !== -1) {
                    inputs[nextEmpty].focus();
                } else {
                    inputs[inputs.length - 1].focus();
                }
            });
        });

        // Auto-focus en el primer input
        if (inputs.length > 0) {
            inputs[0].focus();
        }

        // Función para validar antes de enviar
        function validarCodigo() {
            const inputsList = document.querySelectorAll('.input-codigo');
            const codigoHiddenField = document.getElementById('codigo');

            const codigoCompleto = Array.from(inputsList).map(i => i.value).join('');
            codigoHiddenField.value = codigoCompleto;

            if (codigoCompleto.length !== 6) {
                alert('Por favor, ingresa los 6 dígitos del código');
                return false;
            }
            return true;
        }
    </script>
</section>

</html>
