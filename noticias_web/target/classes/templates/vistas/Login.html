<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{vistas/Inicio :: layout(~{::section})}">

<body>
    <section class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div style="color: var(--primary); margin-bottom: 1rem;">
                    <i data-lucide="newspaper" style="width: 48px; height: 48px;"></i>
                </div>
                <h1 class="auth-title">Bienvenido de nuevo</h1>
                <p style="color: var(--secondary);">Ingresa a tu cuenta para continuar</p>
            </div>

            <div th:if="${error}" class="alert alert-danger">
                <i data-lucide="alert-circle" style="width: 1rem; display: inline; vertical-align: middle;"></i>
                <span th:text="${error}">Error message</span>
            </div>

            <div th:if="${mensaje}" class="alert alert-success">
                <i data-lucide="check-circle" style="width: 1rem; display: inline; vertical-align: middle;"></i>
                <span th:text="${mensaje}">Success message</span>
            </div>

            <form th:action="@{/auth/login}" method="post">
                <input type="hidden" name="redirect" th:value="${redirect}" th:if="${redirect}" />
                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="nombre@ejemplo.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••"
                        required>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem;">
                        <input type="checkbox"> Recordarme
                    </label>
                    <a th:href="@{/auth/olvidar}"
                        style="color: var(--primary); font-size: 0.9rem; font-weight: 500;">¿Olvidaste tu
                        contraseña?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
            </form>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                ¿No tienes una cuenta? <a th:href="@{/auth/registro}"
                    style="color: var(--primary); font-weight: 600;">Regístrate aquí</a>
            </div>
        </div>
    </section>
</body>

</html>
