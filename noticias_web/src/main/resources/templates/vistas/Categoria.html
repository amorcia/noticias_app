<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${categoriaNombre} + ' - NoticiasApp'">Categoría - NoticiasApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header Fragment -->
        <header th:replace="~{vistas/Fragmentos :: header}"></header>

        <main class="container" style="padding: 2rem 1rem;">
            <!-- Category Header with Title and Badge -->
            <div
                style="margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem;"
                        th:text="${categoriaNombre}">Categoría</h1>
                    <span class="badge badge-primary" th:text="${esForo ? 'FORO COMUNITARIO' : 'SECCIÓN OFICIAL'}"
                        style="background-color: #2563EB; color: white; padding: 0.25rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 600;">SECCIÓN
                        OFICIAL</span>
                </div>
            </div>

            <!-- News Grid -->
            <div class="news-grid"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 2rem;">
                <article class="news-card-premium" th:each="noticia : ${noticias}"
                    style="background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); transition: transform 0.2s, box-shadow 0.2s;">

                    <!-- Card Image -->
                    <div class="card-image" style="width: 100%; height: 250px; overflow: hidden;">
                        <img th:src="${noticia.imagenUrl != null ? '/uploads/' + noticia.imagenUrl.substring(noticia.imagenUrl.lastIndexOf('/') + 1) : 'https://source.unsplash.com/random/800x600?news'}"
                            onerror="this.src='https://source.unsplash.com/random/800x600?news'" alt="Noticia"
                            style="width: 100%; height: 100%; object-fit: cover;">
                    </div>

                    <!-- Card Content -->
                    <div class="premium-content" style="padding: 1.5rem;">
                        <div class="card-meta"
                            style="display: flex; gap: 1rem; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;">
                            <span th:text="${#temporals.format(noticia.fechaPublicacion, 'dd MMM yyyy')}">Fecha</span>
                            <span th:text="${noticia.autorNombre}">Autor</span>
                        </div>

                        <h2 class="premium-title" style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem;">
                            <a th:href="@{'/noticia/' + ${noticia.id}}" th:text="${noticia.titulo}"
                                style="text-decoration: none; color: var(--text-main);">Título de la Noticia</a>
                        </h2>

                        <p class="premium-excerpt" th:text="${noticia.subtitulo}"
                            style="color: var(--text-muted); margin-bottom: 1.5rem;">Subtítulo de la noticia...</p>

                        <!-- Interaction Bar with Correct Lucide Icons -->
                        <div class="interaction-bar"
                            style="display: flex; align-items: center; gap: 1rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                            <!-- Like Button -->
                            <button class="interaction-item like" th:onclick="'toggleLike(' + ${noticia.id} + ')'"
                                style="display: flex; align-items: center; gap: 0.5rem; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.5rem; border-radius: 0.375rem; transition: background 0.2s;">
                                <i data-lucide="thumbs-up" style="width: 18px; height: 18px;"></i>
                                <span th:text="${noticia.likes != null ? noticia.likes : 0}">0</span>
                            </button>

                            <!-- Dislike Button -->
                            <button class="interaction-item dislike" th:onclick="'toggleDislike(' + ${noticia.id} + ')'"
                                style="display: flex; align-items: center; gap: 0.5rem; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.5rem; border-radius: 0.375rem; transition: background 0.2s;">
                                <i data-lucide="thumbs-down" style="width: 18px; height: 18px;"></i>
                                <span th:text="${noticia.dislikes != null ? noticia.dislikes : 0}">0</span>
                            </button>

                            <!-- Comment Button -->
                            <a th:href="@{'/noticia/' + ${noticia.id} + '#comentarios'}"
                                class="interaction-item comment"
                                style="display: flex; align-items: center; gap: 0.5rem; text-decoration: none; color: var(--text-muted); padding: 0.5rem; border-radius: 0.375rem; transition: background 0.2s;">
                                <i data-lucide="message-circle" style="width: 18px; height: 18px;"></i>
                                <span th:text="${noticia.comentarios != null ? noticia.comentarios : 0}">0</span>
                            </a>

                            <!-- Report Button -->
                            <button class="interaction-item report"
                                th:onclick="'openReportModal(' + ${noticia.id} + ')'"
                                style="display: flex; align-items: center; gap: 0.5rem; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0.5rem; border-radius: 0.375rem; transition: background 0.2s;">
                                <i data-lucide="flag" style="width: 18px; height: 18px;"></i>
                            </button>

                            <!-- Delete Button (Admin/Owner/Author only) -->
                            <button
                                th:if="${session.usuario != null and (#strings.equalsIgnoreCase(session.usuario.rolNombre, 'ADMIN') or #strings.equalsIgnoreCase(session.usuario.rolNombre, 'OWNER') or session.usuario.id == noticia.autorId)}"
                                th:onclick="'deleteNoticia(' + ${noticia.id} + ')'" class="interaction-item"
                                style="display: flex; align-items: center; gap: 0.5rem; background: none; border: none; cursor: pointer; color: var(--danger); padding: 0.5rem; border-radius: 0.375rem; margin-left: auto; transition: background 0.2s;">
                                <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
                            </button>
                        </div>
                    </div>
                </article>
            </div>

            <!-- Empty State -->
            <div th:if="${noticias == null or noticias.empty}" class="alert alert-info"
                style="padding: 2rem; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-top: 2rem;">
                <i data-lucide="inbox" style="width: 48px; height: 48px; margin: 0 auto 1rem; opacity: 0.5;"></i>
                <p style="color: var(--text-muted); font-size: 1.125rem;">No hay noticias en esta categoría todavía.</p>
            </div>
        </main>

        <footer class="main-footer"
            style="padding: 2rem; text-align: center; border-top: 1px solid var(--border); margin-top: auto;">
            <p>&copy; 2025 NoticiasApp</p>
        </footer>
    </div>

    <script>
        lucide.createIcons();

        // Interaction functions
        async function toggleLike(id) {
            try {
                const res = await fetch(`/noticia/${id}/votar?tipo=LIKE`, { method: 'POST' });
                if (res.ok) location.reload();
            } catch (e) { console.error(e); }
        }

        async function toggleDislike(id) {
            try {
                const res = await fetch(`/noticia/${id}/votar?tipo=DISLIKE`, { method: 'POST' });
                if (res.ok) location.reload();
            } catch (e) { console.error(e); }
        }

        async function deleteNoticia(id) {
            if (!confirm('¿Estás seguro de que quieres eliminar esta noticia?')) return;
            try {
                const res = await fetch(`/noticia/${id}`, { method: 'DELETE' });
                if (res.ok) location.reload();
            } catch (e) { console.error(e); }
        }

        function openReportModal(id) {
            // Implement report modal if needed
            alert('Funcionalidad de denuncia - ID: ' + id);
        }
    </script>
</body>

</html>
